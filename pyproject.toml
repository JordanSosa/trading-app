[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compounder"
version = "1.1.0"
description = "Risk-governed multi-asset crypto trading bot measured against a yearly goal: backtest, paper and (opt-in) live trading on one engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
live = ["ccxt>=4.3"]

[project.scripts]
compounder = "compounder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compounder = ["py.typed", "reference.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:logging"
markers = [
    "network: test hits live exchange APIs (deselect with -m 'not network')",
]
