[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "BTC/USDT paper-trading bot: candle-driven forward trading with a backtest engine that shares the exact same code path."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradebot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test hits live exchange APIs (deselect with -m 'not network')",
]
