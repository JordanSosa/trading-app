# BTC/USDT paper-trading configuration for the 30-day forward run.
# Every key is documented in src/tradebot/config.py. Changing strategy, costs or
# risk settings mid-run is refused (see README: Configuration).

[run]
symbol = "BTCUSDT"
timeframe = "1h"
initial_cash = 10000.0
duration_days = 30
end_action = "flatten"      # sell to USDT when the 30 days are up
state_dir = "state"
mode = "paper"              # the only supported mode

[costs]
fee_rate = 0.001            # Binance spot taker fee, no BNB discount
slippage_bps = 3.0
min_notional = 10.0
qty_step = 0.00001

[risk]
max_exposure = 1.0
min_rebalance = 0.10
circuit_breaker_dd = 0.10   # 10% below the high-water mark -> flat for 48h
circuit_breaker_hours = 48.0
campaign_stop_loss = 0.15   # 15% below initial capital -> flat for the rest of the run
stop_rearm = true
stop_cooldown_bars = 0

# Selected in research/SELECTION.md (2018-2024 data), holdout in research/RESULTS.md.
# Long-only dual breakout: half position on a 144h Donchian breakout above the
# 600h EMA trend filter, half on a close above EMA600 + 3 x ATR168; each half
# exits on its own channel/band. Exposure is 0, 0.5 or 1.
[strategy]
name = "breakout_dual"

[strategy.params]
entry_n = 144
exit_n = 72
trend_n = 600
band_k = 3.0
atr_n = 168
keltner_weight = 0.5

[data]
providers = ["binance_vision", "okx", "kucoin", "gate", "coinbase"]
lookback_bars = 3000        # the bot fetches max(this, warm-up + 720) bars per tick
sanity_check = true
max_price_deviation = 0.015
request_timeout_s = 15.0
retries = 3

[notify]
on_trade = true
on_alert = true
daily_summary = true
