# 24/7 paper trading on any always-on machine:
#   docker compose up -d --build                                       # start (resumes an existing run)
#   docker compose logs -f                                             # follow ticks
#   docker compose exec compounder compounder status --state-dir /state
#   docker compose run --rm -p 8080:8080 compounder serve --state-dir /state --host 0.0.0.0
#
# State lives in the named volume `compounder-state`. Copy it out with:
#   docker compose cp compounder:/state ./state-export
services:
  compounder:
    build: .
    restart: on-failure
    volumes:
      - compounder-state:/state
    env_file:
      - path: .env          # optional notification secrets, see .env.example
        required: false

volumes:
  compounder-state: {}
